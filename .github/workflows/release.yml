name: Build release assets

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify the release tag and source versions
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.ok(pkg.version.split('.').every(part => Number(part) <= 65535));
          assert.ok(pkg.version.split('.').some(part => Number(part) > 0));
          assert.ok([pkg.version, `v${pkg.version}`].includes(process.env.RELEASE_TAG),
            'The release tag must match package.json (for example, v1.0.0 or 1.0.0).');
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          JS

      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npm run check:bundle

      - name: Package and verify the Chrome extension
        run: python3 scripts/package-release.py

      - name: Attach assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
